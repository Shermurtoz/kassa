<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Касса клиентов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg: var(--tg-theme-bg-color,#ffffff);
  --bg2: var(--tg-theme-secondary-bg-color,#f1f2f6);
  --sec: var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#ffffff));
  --text: var(--tg-theme-text-color,#141414);
  --hint: var(--tg-theme-hint-color,#8a8f98);
  --link: var(--tg-theme-link-color,#2481cc);
  --btn: var(--tg-theme-button-color,#2481cc);
  --btn-text: var(--tg-theme-button-text-color,#ffffff);
  --sep: var(--tg-theme-section-separator-color,rgba(127,127,127,.18));
  --red: var(--tg-theme-destructive-text-color,#e5484d);
  --green:#2fa36b;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg2);border:1px solid transparent;border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--btn)}
:root{--top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bg2);padding:calc(12px + var(--top)) 16px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sec);font-size:17px}
.periods{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.periods::-webkit-scrollbar{display:none}
.chip{padding:6px 12px;border-radius:20px;background:var(--sec);white-space:nowrap;font-size:14px}
.chip.on{background:var(--btn);color:var(--btn-text)}
main{padding:0 16px}
.card{background:var(--sec);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid2 .card{margin:0}
.label{color:var(--hint);font-size:13px}
.big{font-size:24px;font-weight:700;margin-top:2px;word-break:break-word}
.mid{font-size:18px;font-weight:650;margin-top:2px;word-break:break-word}
.green{color:var(--green)}.red{color:var(--red)}.hint{color:var(--hint)}
.section-title{color:var(--hint);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px}
.list{background:var(--sec);border-radius:var(--radius);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;width:100%;text-align:left}
.item+.item:before{content:"";position:absolute;top:0;left:64px;right:0;border-top:1px solid var(--sep)}
.item .body{flex:1;min-width:0}
.item .title{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{color:var(--hint);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:650;white-space:nowrap;text-align:right}
.item .amt small{display:block;font-weight:400;font-size:12px;color:var(--hint)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex-shrink:0}
.empty{text-align:center;color:var(--hint);padding:28px 16px}
.search{margin-bottom:10px;background:var(--sec)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;font-weight:600;text-align:center;background:var(--sec)}
.btn.primary{background:var(--btn);color:var(--btn-text)}
.btn.danger{color:var(--red)}
.btn+.btn{margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row2 .btn{margin:0}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--btn);color:var(--btn-text);font-size:30px;line-height:56px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:6}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sec);border-top:1px solid var(--sep);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;padding:8px 0 10px;font-size:12px;color:var(--hint);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--btn)}
.client-head{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.client-head .avatar{width:52px;height:52px;font-size:20px}
.client-head h2{margin:0;font-size:20px;word-break:break-word}
.client-head a{color:var(--link);text-decoration:none;font-size:14px}
.day{color:var(--hint);font-size:13px;margin:14px 4px 6px}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));max-height:calc(100vh - var(--top) - 24px);max-height:calc(100dvh - var(--top) - 24px);overflow-y:auto;transform:translateY(100%);transition:transform .25s ease}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 10px}
.sheet h3{margin:4px 0 14px;font-size:18px}
.field{margin-bottom:12px}
.field label{display:block;color:var(--hint);font-size:13px;margin:0 0 5px 2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border-radius:11px;padding:3px;margin-bottom:14px}
.seg button{padding:9px;border-radius:9px;font-weight:600;color:var(--hint)}
.seg button.on{background:var(--sec);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cur-toggle{margin:0;grid-template-columns:auto auto;padding:2px;border-radius:10px;background:var(--sec)}
.cur-toggle button{padding:6px 11px;font-size:14px;border-radius:8px}
.seg.small{margin-bottom:10px}
.warn{color:#e5a03a}
.amount-input{font-size:22px;font-weight:650}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{padding:5px 10px;border-radius:14px;background:var(--bg2);font-size:13px}
.toast{position:fixed;left:50%;top:calc(16px + var(--top));transform:translateX(-50%) translateY(-80px);background:rgba(20,20,20,.88);color:#fff;padding:9px 16px;border-radius:20px;z-index:40;transition:transform .25s;font-size:14px}
.toast.show{transform:translateX(-50%) translateY(0)}
textarea{min-height:160px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.split-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--sep);font-size:14px}
.split-row:first-of-type{border-top:0}
.split-row b{white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--green)}
</style>
</head>
<body>

<header>
  <h1 id="title">Касса клиентов</h1><span id="syncDot" class="hint" style="font-size:14px;min-width:16px"></span>
  <div class="seg cur-toggle" id="curToggle"><button data-c="USD" onclick="setDisp('USD')">$</button><button data-c="UZS" onclick="setDisp('UZS')">сум</button></div>
  <button class="icon-btn" onclick="openReport()" aria-label="Отчёт">📋</button>
  <button class="icon-btn" onclick="openSettings()" aria-label="Настройки">⚙️</button>
</header>
<div class="periods" id="periods"></div>
<main id="main"></main>

<button class="fab" onclick="openOp()" aria-label="Добавить">+</button>
<nav id="nav">
  <button data-tab="summary" onclick="setTab('summary')"><span>📊</span>Сводка</button>
  <button data-tab="clients" onclick="setTab('clients')"><span>👥</span>Клиенты</button>
  <button data-tab="payouts" onclick="setTab('payouts')"><span>💸</span>Выплаты</button>
  <button data-tab="history" onclick="setTab('history')"><span>🧾</span>История</button>
</nav>

<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= НАСТРОЙКА ОБЩЕЙ КАССЫ =================
   Вставьте сюда ссылку веб-приложения Google Apps Script (заканчивается на /exec).
   Пусто — каждый пользователь видит только свои данные. */
const API_URL = 'https://script.google.com/macros/s/AKfycbwvfli9GyDkYHSpavrmXmCljJ4Z-aY445vNRsaOaR8l5PUhsPZHZSunGUe7rbKR7yGgiw/exec';

/* ================= Telegram ================= */
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
const inTg = !!(tg && tg.platform && tg.platform !== 'unknown');
const ver = v => inTg && tg.isVersionAtLeast && tg.isVersionAtLeast(v);
if (inTg) {
  tg.ready(); tg.expand();
  /* полноэкранный режим: отступ сверху под кнопки Telegram */
  const applyInsets=()=>{ const a=tg.safeAreaInset||{}, b=tg.contentSafeAreaInset||{}; const t=(+a.top||0)+(+b.top||0);
    if(t>0) document.documentElement.style.setProperty('--top', t+'px'); else document.documentElement.style.removeProperty('--top'); };
  applyInsets(); ['safeAreaChanged','contentSafeAreaChanged','fullscreenChanged','viewportChanged'].forEach(ev=>{ try{ tg.onEvent(ev, applyInsets); }catch(e){} });
  try { if (ver('7.7')) tg.disableVerticalSwipes(); } catch(e){}
  if (ver('6.1')) tg.BackButton.onClick(goBack);
}
function haptic(type){ try{ if(ver('6.1')) type==='light'?tg.HapticFeedback.impactOccurred('light'):tg.HapticFeedback.notificationOccurred(type);}catch(e){} }
function confirmBox(msg, cb){ if(ver('6.2')) tg.showConfirm(msg, ok=>ok&&cb()); else if(confirm(msg)) cb(); }

/* ================= Data ================= */
const LS_KEY = 'cashbook_v1';
const DEFAULT_TASKS = [
  {id:'t1',name:'Моделирование зданий',pct:5},{id:'t2',name:'Моделирование генплана',pct:5},
  {id:'t3',name:'Сборка сцен и детализация',pct:5},{id:'t4',name:'Материалы и атмосфера',pct:5},
  {id:'t5',name:'Камеры и рендер',pct:3},{id:'t6',name:'Постобработка (ИИ)',pct:2},{id:'t7',name:'Анимация и монтаж ролика',pct:5}];
const DEFAULT_SPLIT = { staff:30, charity:10, partner:45, advance:40, me:'Шерзод', partnerName:'Бехзод', staffList:['Эльдор','Олим','Вугар'], tasks:DEFAULT_TASKS };
let data = { v:1, disp:'USD', rate:12500, clients:[], projects:[], ops:[], updated:0, split:{...DEFAULT_SPLIT} };
const SYM = { USD:'$', UZS:'сум' };
function fixData(){
  data.split = sp();
  for (const k of ['clients','projects','ops']) if(!Array.isArray(data[k])) data[k] = [];
  if(!data.disp) data.disp = data.currency==='$' ? 'USD' : 'UZS';
  if(!(data.rate>0)) data.rate = 12500;
  const legacy = data.currency==='$' ? 'USD' : (data.currency ? 'UZS' : data.disp);
  data.ops.forEach(o=>{ if(!o.cur) o.cur = legacy; });
  delete data.currency;
}
function conv(a, from, to, rate){ const r=rate>0?rate:data.rate; if(from===to) return a; return from==='USD' ? a*r : a/r; }
const amt = o => conv(o.amount, o.cur||data.disp, data.disp, o.rate);
/* поле курса: id, значение по умолчанию; eqId — куда писать эквивалент */
function rateField(id, val, oninput){ return `<div class="field" style="display:flex;align-items:center;gap:8px;margin-top:-4px">
  <label style="margin:0;white-space:nowrap">Курс: 1 $ =</label>
  <input id="${id}" inputmode="decimal" value="${fmtNum(val||data.rate)}" style="flex:1;padding:8px 10px" oninput="fmtInput(this);${oninput}">
  <span class="hint">сум</span></div>`; }
function rateVal(id){ const r=parseAmt(document.getElementById(id)?.value||0); return r>0?r:data.rate; }
function eqText(a, cur, rate){ if(!(a>0)) return ''; return '≈ '+(cur==='USD'?moneyC(a*rate,'UZS'):moneyC(a/rate,'USD')); }
function rememberRate(r){ if(r>0 && Math.abs(r-data.rate)>0.001) data.rate=r; }
function sp(){ return Object.assign({...DEFAULT_SPLIT}, data.split||{}); }
function tasks(){ return (sp().tasks||DEFAULT_TASKS); }
function staffPct(){ return Math.round(tasks().reduce((s,t)=>s+(+t.pct||0),0)*100)/100; }
function staffList(){ return sp().staffList||[]; }
/* сколько получает каждый исполнитель с суммы a по проекту pid */
/* доля сотрудников по проекту = сумма % только назначенных работ; неназначенные идут в общий остаток */
/* режим проекта: 'part' — несделанные работы идут в общий остаток; 'full' — все 30% делятся на назначенные работы пропорционально */
function projMode(p){ return p && p.mode==='full' ? 'full' : 'part'; }
/* фактический % каждой работы в проекте: {tid:{e,pct}} */
function taskShares(pid){
  const p=project(pid), out={}; if(!p){ tasks().forEach(t=>out[t.id]={e:'',pct:+t.pct||0}); return out; }
  const a=p.assign||{}, asg=tasks().filter(t=>a[t.id]).reduce((s,t)=>s+(+t.pct||0),0);
  const k = projMode(p)==='full' && asg>0 ? staffPct()/asg : 1;
  tasks().forEach(t=>{ out[t.id] = a[t.id] ? {e:a[t.id], pct:(+t.pct||0)*k} : {e:'', pct:0}; });
  return out;
}
function projStaffPct(pid){ const sh=taskShares(pid); return Math.round(Object.values(sh).reduce((s,x)=>s+x.pct,0)*100)/100; }
function empPct(pid){ const sh=taskShares(pid), out={}; for(const id in sh){ const x=sh[id]; if(x.pct<=0) continue; out[x.e]=(out[x.e]||0)+x.pct; } return out; }
function empSplit(a, pid){ const ep=empPct(pid), out={}; for(const e in ep) out[e]=a*ep[e]/100; return out; }
function setMode(pid, m){ const p=project(pid); p.mode=m; save(); render(); haptic('light'); }
function splitOf(a, pid){
  const p=sp(), pct=projStaffPct(pid), staff=a*pct/100, rest=a-staff, charity=rest*p.charity/100, partner=rest*p.partner/100;
  return { staff, rest, charity, partner, me: rest-charity-partner, pct };
}
/* сумма распределений по списку оплат (у каждой — свой проект) */
function splitSum(list){
  const x={staff:0,rest:0,charity:0,partner:0,me:0,total:0};
  for(const o of list){ const a=amt(o), y=splitOf(a,o.projectId); for(const k of ['staff','rest','charity','partner','me']) x[k]+=y[k]; x.total+=a; }
  x.pct = x.total>0 ? Math.round(x.staff/x.total*1000)/10 : staffPct();
  return x;
}
function splitRowsP(a, pid){
  const rows=splitRows(a, pid), es=empSplit(a,pid), ep=empPct(pid);
  const emp=Object.keys(es).sort((x,y)=>(x===''?1:0)-(y===''?1:0)).map(e=>['<span style="padding-left:18px" class="hint">'+(e?'👤 '+esc(e):'❔ Не назначено')+' ('+Math.round(ep[e]*100)/100+'%)</span>', es[e]]);
  return [rows[0], ...emp, ...rows.slice(1)];
}
function splitRows(a, pid){
  const p=sp(), x=(typeof a==='object')?a:splitOf(a, pid), r=Math.round;
  return [['👷 Сотрудникам ('+x.pct+'%)',x.staff],['🤲 Благотворительность ('+p.charity+'% от остатка)',x.charity],
          ['🙋 '+esc(p.me)+' ('+r((100-p.charity-p.partner)*100)/100+'%)',x.me],['🙋 '+esc(p.partnerName)+' ('+p.partner+'%)',x.partner]];
}
const ui = { tab:'summary', period:'month', clientId:null, projectId:null, q:'', sheet:false, denied:null };
const SHARED = !!API_URL;

const hasCloud = ver('6.9') && !!tg.CloudStorage;
const useCloud = !SHARED && hasCloud;
const cGet = keys => new Promise((res,rej)=>tg.CloudStorage.getItems(keys,(e,v)=>e?rej(e):res(v||{})));
const cSet = (k,v) => new Promise((res,rej)=>tg.CloudStorage.setItem(k,v,(e,ok)=>e?rej(e):res(ok)));
const cDel = keys => new Promise((res,rej)=>tg.CloudStorage.removeItems(keys,(e,ok)=>e?rej(e):res(ok)));
const CHUNK = 3000;

async function cloudLoad(){
  const n = parseInt((await cGet(['n'])).n || '0', 10);
  if (!n) return null;
  const keys = Array.from({length:n},(_,i)=>'d'+i);
  let s = '';
  for (let i=0;i<keys.length;i+=50){
    const part = await cGet(keys.slice(i,i+50));
    keys.slice(i,i+50).forEach(k=> s += part[k] || '');
  }
  return JSON.parse(s);
}
let saving=false, pending=false, saveTimer=null, cloudLoaded=false, syncState='';
async function cloudSave(){
  if (saving){ pending=true; return; }
  saving=true;
  try{
    const s = JSON.stringify(data), chunks=[];
    for(let i=0;i<s.length;i+=CHUNK) chunks.push(s.slice(i,i+CHUNK));
    const old = parseInt((await cGet(['n'])).n || '0', 10);
    await Promise.all(chunks.map((c,i)=>cSet('d'+i,c)));
    await cSet('n', String(chunks.length));
    if (old > chunks.length) await cDel(Array.from({length:old-chunks.length},(_,i)=>'d'+(chunks.length+i)));
  }catch(e){ console.warn('cloud save failed', e); }
  saving=false;
  if (pending){ pending=false; cloudSave(); }
}
function save(){
  data.updated = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){}
  if (useCloud && cloudLoaded){ clearTimeout(saveTimer); saveTimer=setTimeout(cloudSave, 500); }
  if (SHARED){ persistShared(); clearTimeout(saveTimer); saveTimer=setTimeout(sync, 300); }
}

/* ================= Общая касса (Google Таблица) ================= */
const SH_KEY = 'cashbook_shared_v1', KINDS = ['clients','projects','ops'];
let lastSynced = null, syncing = false, syncAgain = false;
const clone = x => JSON.parse(JSON.stringify(x));
const snap = d => clone({ clients:d.clients, projects:d.projects, ops:d.ops, settings:{ split:d.split, rate:d.rate } });
function diff(base, cur){
  const ch = {}; let any = false;
  for (const k of KINDS){
    const bm = new Map((base[k]||[]).map(r=>[r.id, JSON.stringify(r)])), out = [];
    const cm = new Set();
    for (const r of cur[k]||[]){ cm.add(r.id); if (bm.get(r.id) !== JSON.stringify(r)) out.push(r); }
    for (const id of bm.keys()) if (!cm.has(id)) out.push({ id, del:true });
    if (out.length){ ch[k] = out; any = true; }
  }
  if (JSON.stringify(base.settings||null) !== JSON.stringify(cur.settings)){ ch.settings = cur.settings; any = true; }
  return any ? ch : null;
}
function applyDiff(d, ch){
  if (!ch) return;
  for (const k of KINDS) for (const r of ch[k]||[]){
    const i = d[k].findIndex(x=>x.id===r.id);
    if (r.del){ if (i>=0) d[k].splice(i,1); }
    else if (i>=0) d[k][i] = r; else d[k].push(r);
  }
  if (ch.settings){ d.split = ch.settings.split; d.rate = ch.settings.rate; }
}
function persistShared(){ try{ localStorage.setItem(SH_KEY, JSON.stringify({ data, synced:lastSynced })); }catch(e){} }
function setSync(st){ syncState = st; const el = document.getElementById('syncDot'); if (el){ el.textContent = st==='sync'?'⟳':st==='err'?'⚠️':st==='ok'?'✓':''; el.title = st==='err'?'Нет связи с общей кассой':''; } }
async function sync(){
  if (!SHARED) return;
  if (syncing){ syncAgain = true; return; }
  syncing = true; setSync('sync');
  const sent = snap(data);
  const changes = lastSynced ? diff(lastSynced, sent) : diff({}, sent);
  try{
    const resp = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ initData: tg ? tg.initData : '', changes: changes || {} }) });
    const r = await resp.json();
    if (r.forbidden){ ui.denied = r; setSync('err'); render(); syncing = false; return; }
    if (r.error) throw new Error(r.error);
    ui.denied = null; ui.me = r.me;
    const before = JSON.stringify(snap(data));
    const during = diff(sent, snap(data));
    lastSynced = { clients:r.clients||[], projects:r.projects||[], ops:r.ops||[], settings:r.settings || sent.settings };
    data.clients = clone(lastSynced.clients); data.projects = clone(lastSynced.projects); data.ops = clone(lastSynced.ops);
    if (r.settings){ data.split = r.settings.split; data.rate = r.settings.rate; }
    applyDiff(data, during);
    fixData(); persistShared();
    if (JSON.stringify(snap(data)) !== before) render();
    setSync('ok');
    if (during) syncAgain = true;
  }catch(e){ console.warn('sync failed', e); setSync('err'); }
  syncing = false;
  if (syncAgain){ syncAgain = false; setTimeout(sync, 200); }
}
const meName = () => (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || '';
async function load(){
  if (SHARED){
    let st = null; try{ st = JSON.parse(localStorage.getItem(SH_KEY)); }catch(e){}
    if (st && st.data){ data = st.data; lastSynced = st.synced; }
    else {
      // первый запуск общей кассы: берём личные данные этого устройства, чтобы загрузить их в общую
      try{ const l = JSON.parse(localStorage.getItem(LS_KEY)); if (l && l.clients) data = l; }catch(e){}
      if (hasCloud){ try{ const c = await cloudLoad(); if (c && c.clients){ for (const k of KINDS) for (const r of (c[k]||[])) if (!data[k].some(x=>x.id===r.id)) data[k].push(r); } }catch(e){} }
    }
    fixData(); render(); sync();
    setInterval(()=>{ if (!document.hidden && !ui.sheet) sync(); }, 15000);
    document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) sync(); });
    return;
  }
  try{ const l = JSON.parse(localStorage.getItem(LS_KEY)); if (l && l.clients) data = l; }catch(e){}
  fixData();
  render();
  if (useCloud){
    try{
      const c = await cloudLoad();
      if (c && c.clients && ((c.updated||0) > (data.updated||0) || (!data.clients.length && c.clients.length))){ data=c; fixData(); localStorage.setItem(LS_KEY, JSON.stringify(data)); render(); }
      else if (data.updated && data.clients.length && (!c || (c.updated||0) < data.updated)) setTimeout(cloudSave, 0);
      cloudLoaded=true; syncState='ok';
    }catch(e){ console.warn('cloud load failed', e); syncState='err'; }
  }
}

const nfU = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}), nfS = new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const moneyC = (n,cur) => cur==='USD' ? nfU.format(Math.round(n*100)/100)+' $' : nfS.format(Math.round(n))+' сум';

const parseAmt = s => { const n = parseFloat(String(s).replace(/\s/g,'').replace(',','.')); return isFinite(n) ? n : 0; };
function todayStr(d=new Date()){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_N=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function dateHuman(s){
  const t=todayStr(), y=todayStr(new Date(Date.now()-864e5));
  if(s===t) return 'Сегодня'; if(s===y) return 'Вчера';
  const [Y,M,D]=s.split('-').map(Number);
  return D+' '+MONTHS[M-1]+(Y!==new Date().getFullYear()?' '+Y:'');
}

function debtBalance(cid){ let b=0; for(const o of data.ops) if(o.clientId===cid && (o.type==='charge'||o.type==='payment')){ const p=project(o.projectId); if(p && pStatus(p)==='new') continue; b += o.type==='charge'?amt(o):-amt(o); } return b; }
function clientTotals(cid){ let ch=0,paid=0; for(const o of data.ops) if(o.clientId===cid){ if(o.type==='charge') ch+=amt(o); else if(o.type==='payment') paid+=amt(o); } return {ch,paid,b:ch-paid}; }
/* доли благотворительности / партнёров по проектам: [{pid,acc,paid,left}] */
function poolProjRows(k){
  const acc={}, paid={}; let legacy=0;
  for(const o of data.ops){
    if(o.type==='payment'){ const p=o.projectId||''; acc[p]=(acc[p]||0)+splitOf(amt(o),o.projectId)[k]; }
    else if(o.type==='payout' && o.pool===k){ if(o.projectId) paid[o.projectId]=(paid[o.projectId]||0)+amt(o); else legacy+=amt(o); }
  }
  const ids=[...new Set(Object.keys(acc).concat(Object.keys(paid)))];
  const rows=ids.map(pid=>({pool:k,e:'',pid,acc:acc[pid]||0,paid:paid[pid]||0}));
  /* старые выплаты без проекта — гасим по проектам, начиная со старых */
  if(legacy>0.004){ let rest=legacy;
    for(const r of rows.slice().sort((a,b)=>((project(a.pid)||{}).created||0)-((project(b.pid)||{}).created||0))){ const x=Math.min(Math.max(0,r.acc-r.paid),rest); r.paid+=x; rest-=x; if(rest<=0.004) break; }
    if(rest>0.004){ let r=rows.find(r=>!r.pid); if(!r){ r={pool:k,e:'',pid:'',acc:0,paid:0}; rows.push(r);} r.paid+=rest; }
  }
  rows.forEach(r=>r.left=r.acc-r.paid); return rows;
}
function allProjRows(){ return staffProjRows().map(r=>({...r,pool:'staff'})).concat(...POOLS.filter(k=>k!=='staff').map(poolProjRows)); }
/* начисления сотрудникам по проектам: [{e,pid,acc,paid,left}] */
function staffProjRows(){
  const acc={}, paid={}, legacy={}, K=(e,p)=>e+'\u0001'+(p||'');
  for(const o of data.ops){
    if(o.type==='payment'){ const es=empSplit(amt(o), o.projectId); for(const e in es){ const k=K(e,o.projectId); acc[k]=(acc[k]||0)+es[e]; } }
    else if(o.type==='payout' && o.pool==='staff'){ const e=o.emp||''; if(o.projectId) { const k=K(e,o.projectId); paid[k]=(paid[k]||0)+amt(o); } else legacy[e]=(legacy[e]||0)+amt(o); }
  }
  const map={}; for(const k of Object.keys(acc).concat(Object.keys(paid))){ if(map[k]) continue; const [e,p]=k.split('\u0001'); map[k]={e,pid:p||'',acc:acc[k]||0,paid:paid[k]||0}; }
  const rows=Object.values(map);
  /* старые выплаты без проекта — гасим по проектам этого сотрудника, начиная со старых */
  for(const e in legacy){ let rest=legacy[e];
    const mine=rows.filter(r=>r.e===e).sort((a,b)=>((project(a.pid)||{}).created||0)-((project(b.pid)||{}).created||0));
    for(const r of mine){ const can=Math.max(0,r.acc-r.paid), x=Math.min(can,rest); r.paid+=x; rest-=x; if(rest<=0.004) break; }
    if(rest>0.004){ let r=rows.find(r=>r.e===e&&!r.pid); if(!r){ r={e,pid:'',acc:0,paid:0}; rows.push(r);} r.paid+=rest; }
  }
  rows.forEach(r=>r.left=r.acc-r.paid); return rows;
}
const POOLS = ['staff','charity','me','partner'];
function poolName(k){ const p=sp(); return {staff:'👷 Сотрудникам', charity:'🤲 Благотворительность', me:'🙋 '+p.me, partner:'🙋 '+p.partnerName}[k]||k; }
function poolStats(){
  const x = splitSum(data.ops.filter(o=>o.type==='payment')), out = {};
  for (const k of POOLS){ const paid = data.ops.filter(o=>o.type==='payout'&&o.pool===k).reduce((s,o)=>s+amt(o),0); out[k] = {acc:x[k], paid, left:x[k]-paid}; }
  return out;
}
function staffStats(){
  const acc={}, paid={};
  for(const o of data.ops){
    if(o.type==='payment'){ const es=empSplit(amt(o), o.projectId); for(const e in es) acc[e]=(acc[e]||0)+es[e]; }
    else if(o.type==='payout' && o.pool==='staff'){ const e=o.emp||''; paid[e]=(paid[e]||0)+amt(o); }
  }
  const names=[...staffList()]; for(const e of Object.keys(acc).concat(Object.keys(paid))) if(e && !names.includes(e)) names.push(e);
  const rows=names.map(e=>({e, acc:acc[e]||0, paid:paid[e]||0, left:(acc[e]||0)-(paid[e]||0)}));
  if((acc['']||0)>0.004 || (paid['']||0)>0.004) rows.push({e:'', acc:acc['']||0, paid:paid['']||0, left:(acc['']||0)-(paid['']||0)});
  return rows;
}
function empLabel(e){ return e ? '👤 '+e : '❔ Без исполнителя / общие расходы'; }
function daysTo(d){ const a=new Date(todayStr()+'T00:00:00'), b=new Date(d+'T00:00:00'); return Math.round((b-a)/864e5); }
function dueLabel(d){ const n=daysTo(d); if(n<0) return `просрочен ${-n} ${plural(-n,'день','дня','дней')}`; if(n===0) return 'сегодня'; if(n===1) return 'завтра'; if(n<=7) return `через ${n} ${plural(n,'день','дня','дней')}`; return dateHuman(d); }
function dueCls(d){ const n=daysTo(d); return n<0?'red':n<=1?'warn':''; }
function dueProjects(){ return data.projects.filter(p=>p.due && pStatus(p)!=='new' && pStats(p.id).b>0.004).sort((a,b)=>a.due.localeCompare(b.due)); }
function balTxt(b){ return Math.abs(b)<0.005?'0':money(Math.abs(b)); }
function balSub(b){ return b>0.004?'должен':b<-0.004?'переплата':'закрыт'; }
function balCls(b){ return b>0.004?'red':b<-0.004?'green':'hint'; }
function balance(id){ let b=0; for(const o of data.ops) if(o.clientId===id) b += o.type==='charge'?amt(o):-amt(o); return b; }

/* ================= Periods ================= */
const PERIODS = [['month','Этот месяц'],['prev','Прошлый месяц'],['year','Этот год'],['all','Всё время']];
function periodRange(p){
  const d=new Date(), Y=d.getFullYear(), M=d.getMonth();
  const ym=(y,m)=>{ const dt=new Date(y,m,1); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); };
  if(p==='month') return {pre:ym(Y,M), name:MONTHS_N[M]+' '+Y};
  if(p==='prev'){ const dt=new Date(Y,M-1,1); return {pre:ym(Y,M-1), name:MONTHS_N[dt.getMonth()]+' '+dt.getFullYear()}; }
  if(p==='year') return {pre:String(Y), name:Y+' год'};
  return {pre:'', name:'Всё время'};
}
const inPeriod = o => o.date.startsWith(periodRange(ui.period).pre);

      <button class="btn primary" style="margin-top:16px" onclick="sync()">Проверить снова</button></div>`;

  }

  else if (ui.clientId && client(ui.clientId)) { ui.projectId=null; m.innerHTML = renderClient(client(ui.clientId)); }
  else { ui.clientId=null; ui.projectId=null; m.innerHTML = ui.tab==='summary'?renderSummary():ui.tab==='clients'?renderClients():ui.tab==='payouts'?renderPayouts():renderHistory(); }
  document.getElementById('title').textContent = ui.projectId ? 'Проект' : ui.clientId ? 'Клиент' : {summary:'Сводка',clients:'Клиенты',payouts:'Выплаты',history:'История'}[ui.tab];

function opRow(o, showClient=true){
  if (o.type==='payout'){
    const pp=project(o.projectId);
    const sub=[showClient?'Выплата':'', pp?'📁 '+esc(pp.name):'', o.note?esc(o.note):'', o.by?'👤 '+esc(o.by):''].filter(Boolean).join(' · ') || dateHuman(o.date);
    return `<button class="item" onclick="openOp('${o.id}')"><div class="avatar" style="background:#e5a03a">💸</div>
      <div class="body"><div class="title">${esc(o.pool==='staff'&&o.emp?'👤 '+o.emp:poolName(o.pool))}</div><div class="sub">${sub}</div></div>
      <div class="amt">−${moneyC(o.amount,o.cur||data.disp)}</div></button>`;
  }
  const c = client(o.clientId), name = c?c.name:'—', p = project(o.projectId);
  const pay = o.type==='payment', kind = pay?'Оплата':'Договор';
  const title = showClient ? esc(name) : kind;
  const sub = [showClient ? kind : '', p&&ui.projectId!==p.id ? '📁 '+esc(p.name) : '', o.note?esc(o.note):'', o.by?'👤 '+esc(o.by):''].filter(Boolean).join(' · ') || dateHuman(o.date);
  return `<button class="item" onclick="openOp('${o.id}')">
    ${showClient?avatar(name):`<div class="avatar" style="background:${pay?'var(--green)':'#9aa0a6'}">${pay?'↓':'↑'}</div>`}
    <div class="body"><div class="title">${title}</div><div class="sub">${sub}</div></div>
    <div class="amt ${pay?'green':''}">${pay?'+':''}${moneyC(o.amount,o.cur||data.disp)}</div></button>`;
}
function groupByDay(ops, showClient=true){
  if(!ops.length) return '';
  const sorted=[...ops].sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
  let html='', cur=null, buf=[];
  const flush=()=>{ if(buf.length){ html+=`<div class="day">${dateHuman(cur)}</div><div class="list">${buf.join('')}</div>`; buf=[]; } };
  for(const o of sorted){ if(o.date!==cur){ flush(); cur=o.date; } buf.push(opRow(o, showClient)); }
  flush(); return html;
}

function renderSummary(){

  let debt=0, adv=0; const debtors=[];
  for(const c of data.clients){ const b=debtBalance(c.id); if(b>0.004){debt+=b; debtors.push([c,b]);} else if(b<-0.004) adv+=-b; }
  debtors.sort((a,b)=>b[1]-a[1]);
  const payCount = ops.filter(o=>o.type==='payment').length;
  const pct = charged>0 ? Math.min(100, Math.round(received/charged*100)) : 0;
  if(!data.clients.length) return `<div class="card empty">Пока нет данных.<br><br>Нажмите <b>+</b>, чтобы записать первую оплату или долг клиента.</div>`;

  </div>
  ${received>0?`<div class="card"><div class="label" style="margin-bottom:4px">Распределение полученного</div>${splitRows(splitSum(ops.filter(o=>o.type==='payment'))).map(([n,v])=>`<div class="split-row"><span>${n}</span><b>${money(v)}</b></div>`).join('')}</div>`:''}

    <div class="card"><div class="label">Долг клиентов</div><div class="mid ${debt>0?'red':''}">${money(debt)}</div></div>

  ${adv>0?`<div class="card"><div class="label">Предоплаты / переплаты клиентов</div><div class="mid">${money(adv)}</div></div>`:''}

function dueBlock(){
  const list = dueProjects().filter(p=>daysTo(p.due)<=14);
  if(!list.length) return '';
  return `<div class="section-title">Ожидаемые платежи</div><div class="list">${list.map(p=>{ const c=client(p.clientId), b=pStats(p.id).b;
    return `<button class="item" onclick="openProject('${p.id}')"><div class="avatar" style="background:${daysTo(p.due)<0?'var(--red)':'var(--btn)'}">📅</div>
    <div class="body"><div class="title">${esc(c?c.name:'—')} · ${esc(p.name)}</div><div class="sub ${dueCls(p.due)}">${dueLabel(p.due)}</div></div>
    <div class="amt">${money(b)}<small>остаток</small></div></button>`; }).join('')}</div>`;
}
function payoutsBrief(){
  const ps=poolStats(); if(!POOLS.some(k=>ps[k].acc>0.004)) return '';
  const st=staffStats().filter(r=>Math.abs(r.left)>0.004);
  return `<div class="section-title">К выплате</div><button class="card" style="display:block;width:100%;text-align:left" onclick="setTab('payouts')">
    ${st.map(r=>`<div class="split-row"><span>${esc(empLabel(r.e))}</span><b class="${r.left<-0.004?'red':''}">${money(r.left)}</b></div>`).join('')}
    ${POOLS.filter(k=>k!=='staff').map(k=>`<div class="split-row"><span>${esc(poolName(k))}</span><b class="${ps[k].left<-0.004?'red':''}">${money(ps[k].left)}</b></div>`).join('')}</button>`;
}

function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; }

}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');

let opType='payment', formCur='USD';
function curSeg(fn){ return `<div class="seg small" id="curSeg"><button data-c="USD" onclick="${fn}('USD')">Доллар $</button><button data-c="UZS" onclick="${fn}('UZS')">Сум</button></div>`; }
function markCur(){ document.querySelectorAll('#curSeg button').forEach(b=>b.classList.toggle('on', b.dataset.c===formCur)); document.querySelectorAll('.cur-lbl').forEach(e=>e.textContent=SYM[formCur]); }

function openOp(id=null, type=null, clientId=null, projectId=null){

    <div class="field"><label>Сумма, <span class="cur-lbl"></span> <span class="hint" id="f-eq"></span></label>
      <input id="f-amount" class="amount-input" inputmode="decimal" autocomplete="off" placeholder="0" value="${o?fmtNum(o.amount):''}" oninput="fmtInput(this);updPreview()">
      <div class="quick" id="quick"></div>
      <div class="card" id="preview" style="background:var(--bg2);margin:10px 0 0;display:none"></div></div>

function fillProjects(pid){
  const cid=document.getElementById('f-client').value, sel=document.getElementById('f-project');
  document.getElementById('f-new').style.display = cid==='__new'?'block':'none';
  const ps = cid && cid!=='__new' ? clientProjects(cid) : [];
  if(!pid && ps.length) pid=ps[ps.length-1].id;
  sel.innerHTML = ps.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('')
    + `<option value="__newp" ${!ps.length?'selected':''}>+ Новый проект</option><option value="">Без проекта</option>`;
  document.getElementById('f-newp').style.display = sel.value==='__newp'?'block':'none';
}
function setOpType(t){
  opType=t;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  const q=document.getElementById('quick'); if(!q) return;
  const sel=document.getElementById('f-client').value, ps=document.getElementById('f-project').value;
  const toF = v => conv(v, data.disp, formCur);
  let b=0, ch=0;
  if(ps && ps!=='__newp'){ const st=pStats(ps); b=st.b; ch=st.ch; }
  else if(!ps && sel && sel!=='__new'){ b=balance(sel); ch=data.ops.filter(o=>o.clientId===sel&&o.type==='charge').reduce((s,o)=>s+amt(o),0); }
  const adv = ch*sp().advance/100, btns=[];
  if(t==='payment' && ch>0 && adv<=b+0.004) btns.push([toF(adv),`Аванс ${sp().advance}%: ${moneyC(toF(adv),formCur)}`]);
  if(t==='payment' && b>0.004) btns.push([toF(b),`Весь долг: ${moneyC(toF(b),formCur)}`]);
  q.innerHTML = btns.map(([v,l])=>`<button onclick="document.getElementById('f-amount').value='${fmtNum(formCur==='UZS'?Math.round(v):v)}';updPreview()">${l}</button>`).join('');
  const dw=document.getElementById('f-due-wrap'), pr=project(ps);
  if(dw){ dw.style.display = (t==='payment' && pr) ? 'block' : 'none'; if(pr && dw.dataset.pid!==pr.id){ document.getElementById('f-due').value = pr.due||''; dw.dataset.pid=pr.id; } }
  updPreview();
}
function updPreview(){
  const pv=document.getElementById('preview'); if(!pv) return;
  const a=parseAmt(document.getElementById('f-amount').value);
  const eq=document.getElementById('f-eq'); if(eq) eq.textContent=eqText(a, formCur, rateVal('f-rate'));
  if(opType!=='payment' || !(a>0)){ pv.style.display='none'; return; }
  pv.style.display='block';
  const pj=document.getElementById('f-project'), pid=pj&&project(pj.value)?pj.value:null;

function fmtInput(el){

/* ---------- Report ---------- */
function buildReport(){
  const p=periodRange(ui.period), ops=data.ops.filter(inPeriod);
  const rec=ops.filter(o=>o.type==='payment').reduce((s,o)=>s+amt(o),0);
  const ch=ops.filter(o=>o.type==='charge').reduce((s,o)=>s+amt(o),0);
  const byClient={}; ops.filter(o=>o.type==='payment').forEach(o=>byClient[o.clientId]=(byClient[o.clientId]||0)+amt(o));
  const debtors=data.clients.map(c=>[c,debtBalance(c.id)]).filter(x=>x[1]>0.004).sort((a,b)=>b[1]-a[1]);
  let t=`📊 Отчёт: ${p.name}\n\n💰 Получено: ${money(rec)}\n🧾 Договоры: ${money(ch)}\n⚠️ Общий долг клиентов: ${money(debtors.reduce((s,x)=>s+x[1],0))}\n`;
  if(rec>0){ t+=`\nРаспределение:\n`; splitRows(splitSum(ops.filter(o=>o.type==='payment'))).forEach(([n,v])=>t+=`${n}: ${money(v)}\n`); }
  const payers=Object.entries(byClient).sort((a,b)=>b[1]-a[1]);
  if(payers.length){ t+=`\nОплаты по клиентам:\n`; payers.forEach(([id,s])=>t+=`• ${client(id)?.name||'—'} — ${money(s)}\n`); }
  const pst=poolStats(); if(POOLS.some(k=>pst[k].acc>0.004)){ t+=`\nК выплате (всего):\n`; staffStats().forEach(r=>t+=`${empLabel(r.e)}: ${money(r.left)}\n`); POOLS.filter(k=>k!=='staff').forEach(k=>t+=`${poolName(k)}: ${money(pst[k].left)}\n`); }
  const dp=dueProjects(); if(dp.length){ t+=`\nОжидаемые платежи:\n`; dp.forEach(p=>t+=`• ${client(p.clientId)?.name||'—'} · ${p.name} — ${money(pStats(p.id).b)} (${dueLabel(p.due)})\n`); }
  if(debtors.length){ t+=`\nДолжники:\n`; debtors.forEach(([c,b])=>{ t+=`• ${c.name} — ${money(b)}\n`; clientProjects(c.id).forEach(p=>{ const pb=pStats(p.id).b; if(pb>0.004 && pStatus(p)!=='new') t+=`   📁 ${p.name} — ${money(pb)}\n`; }); }); }
  return t;
}
function openReport(){
  openSheet(`<h3>Отчёт · ${periodRange(ui.period).name}</h3>
    <textarea id="rep" readonly style="min-height:260px;font-family:inherit;font-size:14px">${esc(buildReport())}</textarea>
    <button class="btn primary" style="margin-top:10px" onclick="copyText('rep')">Скопировать</button>
    <div class="hint" style="font-size:12px;text-align:center;margin-top:8px">Период меняется вверху экрана</div>`);
}
function copyText(elId){
  const el=document.getElementById(elId), txt=el.value;
  const ok=()=>{ haptic('success'); toast('Скопировано'); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(fallback); else fallback();
  function fallback(){ el.removeAttribute('readonly'); el.select(); try{ document.execCommand('copy'); ok(); }catch(e){ toast('Выделите текст и скопируйте вручную'); } el.setAttribute('readonly',''); }
}

    <div class="card" style="background:var(--bg2)"><div class="label">Где хранятся данные</div>
      <div style="margin-top:4px">${SHARED?(syncState==='err'?'⚠️ Нет связи с общей кассой — проверьте интернет':'👥 Общая касса (Google Таблица) — все изменения видят все участники'+(ui.me?'<br><span class="hint" style="font-size:13px">Вы: '+esc(ui.me.name)+' · ID '+esc(ui.me.id)+'</span>':'')):useCloud?(syncState==='err'?'⚠️ Облако Telegram недоступно — проверьте интернет':'☁️ В облаке Telegram — доступны с любого вашего устройства'):'💾 Только в этом браузере (приложение открыто не через Telegram-бота)'}</div>
      <div class="hint" style="font-size:13px;margin-top:4px">Клиентов: ${data.clients.length} · Операций: ${data.ops.length}</div></div>
    <div class="section-title">Резервная копия</div>
    <button class="btn" onclick="openBackup()">Экспорт / импорт данных</button>
    <button class="btn danger" onclick="resetAll()">Удалить все данные</button>`);
}
function saveSplit(){
  const g=id=>parseAmt(document.getElementById(id).value);
  const n={...sp(), staff:staffPct(),advance:g('s-adv'),charity:g('s-char'),partner:g('s-part'),
    me:document.getElementById('s-me').value.trim()||DEFAULT_SPLIT.me, partnerName:document.getElementById('s-pname').value.trim()||DEFAULT_SPLIT.partnerName};
  if([n.staff,n.advance,n.charity,n.partner].some(v=>v<0||v>100) || n.charity+n.partner>100){ haptic('error'); return toast('Проверьте проценты'); }
  data.split=n; save(); render(); haptic('success'); toast('Проценты сохранены');
}
function openStaffSettings(){
  openSheet(`<h3>Сотрудники и работы</h3>
    <div class="field"><label>Сотрудники (через запятую)</label><input id="ss-names" value="${esc(staffList().join(', '))}"></div>
    <div class="section-title" style="margin-top:4px">Работы и % от оплаты</div>
    <div id="ss-tasks">${tasks().map(t=>taskRow(t)).join('')}</div>
    <button class="btn" style="margin:6px 0 10px;color:var(--link)" onclick="document.getElementById('ss-tasks').insertAdjacentHTML('beforeend',taskRow({id:uid(),name:'',pct:0}))">+ Добавить работу</button>
    <div class="hint" style="font-size:12px;margin-bottom:10px">Сумма процентов работ = доля сотрудников от каждой оплаты. Сейчас: ${staffPct()}%.</div>
    <button class="btn primary" onclick="saveStaffSettings()">Сохранить</button>`);
}
function taskRow(t){ return `<div class="split-row ss-row" data-id="${t.id}" style="gap:8px;align-items:center">
  <input class="ss-name" value="${esc(t.name)}" placeholder="Название работы" style="flex:1">
  <input class="ss-pct" value="${t.pct}" inputmode="decimal" style="width:64px;text-align:center">
  <button class="icon-btn" style="background:var(--bg2)" onclick="this.parentNode.remove()">✕</button></div>`; }
function saveStaffSettings(){
  const names=document.getElementById('ss-names').value.split(',').map(x=>x.trim()).filter(Boolean);
  const ts=[...document.querySelectorAll('.ss-row')].map(r=>({id:r.dataset.id,name:r.querySelector('.ss-name').value.trim(),pct:parseAmt(r.querySelector('.ss-pct').value)})).filter(t=>t.name);
  const sum=ts.reduce((s,t)=>s+t.pct,0);
  if(!names.length){ haptic('error'); return toast('Добавьте хотя бы одного сотрудника'); }
  if(ts.some(t=>t.pct<0) || sum>100){ haptic('error'); return toast('Проверьте проценты работ'); }
  data.split={...sp(), staffList:names, tasks:ts, staff:Math.round(sum*100)/100};
  save(); closeSheet(); render(); haptic('success'); toast('Сохранено · сотрудникам '+Math.round(sum*100)/100+'%');
}
function openBackup(){
  openSheet(`<h3>Резервная копия</h3>
    <div class="hint" style="font-size:13px;margin-bottom:8px">Скопируйте текст и сохраните (например, в «Избранное» Telegram). Чтобы восстановить — вставьте его сюда и нажмите «Импорт».</div>
    <textarea id="bk">${esc(JSON.stringify({disp:data.disp,rate:data.rate,split:sp(),clients:data.clients,projects:data.projects,ops:data.ops}))}</textarea>
    <div class="row2" style="margin-top:10px"><button class="btn" onclick="copyText('bk')">Копировать</button><button class="btn primary" onclick="importData()">Импорт</button></div>`);
}
function importData(){
  try{
    const d=JSON.parse(document.getElementById('bk').value);
    if(!Array.isArray(d.clients)||!Array.isArray(d.ops)) throw 0;
    confirmBox('Заменить текущие данные импортированными?', ()=>{
      data={v:1,disp:d.disp||data.disp,rate:d.rate||data.rate,currency:d.currency,split:d.split||sp(),clients:d.clients,projects:d.projects||[],ops:d.ops.map(o=>({...o,amount:+o.amount||0})),updated:0}; fixData();
      save(); closeSheet(); render(); haptic('success'); toast('Данные восстановлены');
    });
  }catch(e){ haptic('error'); toast('Неверный формат данных'); }
}
function resetAll(){ confirmBox(SHARED?'Удалить ВСЕХ клиентов и операции у ВСЕХ участников общей кассы? Это нельзя отменить.':'Удалить ВСЕХ клиентов и операции? Это нельзя отменить.', ()=>{ data={v:1,disp:data.disp,rate:data.rate,split:sp(),clients:[],projects:[],ops:[],updated:0}; save(); closeSheet(); ui.clientId=null; ui.projectId=null; render(); toast('Данные удалены'); }); }

load();
</script>
</body>
</html>
